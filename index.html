
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Countdown</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 text-align:center;color:white;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#170b35,#a52b85,#ff765e);
}
.card{
 width:94%;max-width:600px;padding:30px 12px;
 border:2px solid #ff65dc;border-radius:25px;
 background:#160b2ddd;box-shadow:0 0 35px #ff38d9;
}
h1{font-size:clamp(38px,10vw,65px);margin:10px 0;color:#ff71df}
h2{color:#66eaff;letter-spacing:4px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.unit{background:#291344;padding:15px 3px;border-radius:12px;border:1px solid #55eaff}
.num{font-size:clamp(25px,7vw,42px);font-weight:bold;color:white}
small{font-size:11px;color:#ff8de9}
p{color:#ffb8ee}
</style>
</head>
<body>
<div class="card">
<h2>VICE CITY</h2>
<h1>GTA VI</h1>
<p>THE COUNTDOWN</p>
<div class="timer">
<div class="unit"><div class="num" id="d">00</div><small>DAYS</small></div>
<div class="unit"><div class="num" id="h">00</div><small>HOURS</small></div>
<div class="unit"><div class="num" id="m">00</div><small>MINUTES</small></div>
<div class="unit"><div class="num" id="s">00</div><small>SECONDS</small></div>
</div>
<p id="status">WAITING FOR GTA VI...</p>
</div>
<script>
const target=new Date(2026,10,19,0,0,0);
function update(){
 let t=target-Date.now();
 if(t<=0){
 document.getElementById("status").innerText="GTA VI IS HERE!";
 t=0;
 }
 const values=[
 Math.floor(t/86400000),
 Math.floor(t%86400000/3600000),
 Math.floor(t%3600000/60000),
 Math.floor(t%60000/1000)
 ];
 ["d","h","m","s"].forEach((id,i)=>{
 document.getElementById(id).innerText=String(values[i]).padStart(2,"0");
 });
}
update();
setInterval(update,1000);
</script>
</body>
</html>
